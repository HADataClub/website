<div style="text-align: center; margin-top: 1em; font-size: 0.9em;">
  👁️ Page views: <span id="viewcount">...</span>
</div>

<script>
(function () {
  const el = document.getElementById("viewcount");
  const ns = "hadataclub.github.io/website"; // namespace for your site
  // page-specific key: remove leading/trailing slashes, replace non-word chars with _
  const key = (location.pathname.replace(/^\/|\/$/g, '').replace(/[^\w-]/g, '_')) || 'home';

  const url = `https://countapi.xyz/hit/${encodeURIComponent(ns)}/${encodeURIComponent(key)}`;

  fetch(url, { cache: "no-store" })
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(d => { el.textContent = (d && d.value != null) ? d.value.toLocaleString() : "—"; })
    .catch(() => { el.textContent = "—"; });
})();
</script>
